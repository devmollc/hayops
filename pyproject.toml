[project]
name = "hayops"
version = "0.1.0"
description = "Self-hosted, multi-product support desk: shared agent dashboard, branded portals, email and an embeddable widget"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6.0",
    "psycopg[binary]>=3.2",
    "django-htmx>=1.19",
    "django-tailwind-cli>=2.16",
    "procrastinate[django]>=2.1",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "pillow>=10.4",
    "python-decouple>=3.8",
    "pyjwt>=2.9",
    "markdown>=3.7",
    "gunicorn>=22.0",
    "whitenoise>=6.7",
    "django-storages[boto3]>=1.14",
    "django-ses[events]>=4.0",
    "boto3>=1.42.60",
    "mcp>=2.2",
    "uvicorn-worker>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "django-watchfiles>=1.0",
    "django-debug-toolbar>=4.4",
    "factory-boy>=3.3",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["tests.py", "test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 120
# Django generates these; reformatting them only creates diff noise and makes
# it harder to see that a migration is unmodified from what makemigrations wrote.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
