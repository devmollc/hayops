{% extends "portal/base.html" %}

{% block title %}Link expired{% endblock %}

{% block content %}
<div class="max-w-md mx-auto text-center">
    <div class="card p-8">
        <h1 class="text-2xl font-bold text-gray-900 mb-3">This link no longer works</h1>
        <p class="text-gray-600 mb-6">
            Sign-in links can only be used once, and they expire. Request a fresh one and we'll email it to you.
        </p>
        <a href="{% url 'portal:login' %}" class="btn btn-primary">Email me a new link</a>
    </div>
</div>
{% endblock %}
