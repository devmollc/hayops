{% extends base_template|default:"base.html" %}

{% block title %}Delete Article - Knowledge Base{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="{% url 'kb:article_detail' slug=article.slug %}" class="text-sm text-blue-600 hover:underline">&larr; Back to Article</a>
</div>

<div class="rounded-lg border border-red-200 bg-white p-6">
    <h1 class="mb-4 text-xl font-bold text-gray-900">Delete Article</h1>
    <p class="mb-6 text-gray-600">Are you sure you want to delete "<strong>{{ article.title }}</strong>"? This action cannot be undone.</p>

    <form method="post">
        {% csrf_token %}
        <div class="flex items-center space-x-3">
            <button type="submit" class="inline-flex items-center rounded-md bg-red-600 px-4 py-2 text-sm font-semibold text-white hover:bg-red-500">Delete Article</button>
            <a href="{% url 'kb:article_detail' slug=article.slug %}" class="text-sm text-gray-500 hover:text-gray-700">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
