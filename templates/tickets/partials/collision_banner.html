{% if other_viewers %}
<div class="bg-amber-50 border border-amber-200 rounded-md p-3 mb-4 flex items-center">
    <svg class="w-5 h-5 text-amber-600 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
    </svg>
    <span class="text-sm text-amber-800">
        {% for viewer in other_viewers %}{{ viewer }}{% if not forloop.last %}, {% endif %}{% endfor %}
        {% if other_viewers|length == 1 %}is{% else %}are{% endif %} also viewing this ticket
    </span>
</div>
{% endif %}
