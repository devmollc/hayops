{% extends "accounts/base_auth.html" %}

{% block title %}Password reset — HayOps{% endblock %}

{% block auth_content %}
<div class="auth-status-icon auth-status-icon-success">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
</div>
<h1 class="auth-heading">Password reset</h1>
<p class="auth-subheading">Your password has been set. You can now sign in with your new password.</p>

<a href="{% url 'accounts:login' %}" class="auth-btn auth-btn-primary">Sign in</a>
{% endblock %}
